<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shape Detectives</title>
<style>
:root{--bg:#fff7e0;--card:#ffffff;--ink:#2b2d5b;--soft:#6b6f9c;--line:#ffd86b;--good:#1fae6b;--goodbg:#d9f7e8;--oops:#e2564f;--oopsbg:#ffe3e0;--btn:#5b5fe8;--btntxt:#fff;--opt:#f1f0ff;--optb:#cfcdf7;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1d3a;--card:#2a2c52;--ink:#fff6dc;--soft:#b9bbe6;--line:#e0b73f;--good:#58e0a0;--goodbg:#1d4a3b;--oops:#ff8f87;--oopsbg:#4d2a33;--btn:#8a8dff;--btntxt:#14153a;--opt:#363968;--optb:#5a5da3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1d3a;--card:#2a2c52;--ink:#fff6dc;--soft:#b9bbe6;--line:#e0b73f;--good:#58e0a0;--goodbg:#1d4a3b;--oops:#ff8f87;--oopsbg:#4d2a33;--btn:#8a8dff;--btntxt:#14153a;--opt:#363968;--optb:#5a5da3;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka","Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;font-size:20px;line-height:1.35;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:640px;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{font-size:2.1rem;margin:0;text-align:center;line-height:1.1}
h2{font-size:1.5rem;margin:0}
p{margin:0}
.card{background:var(--card);border:4px solid var(--line);border-radius:28px;padding:18px;text-align:center}
.big{font-size:4rem;line-height:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--opt);border-radius:20px;padding:10px;font-size:1rem}
.mini b{display:block;font-size:1.15rem}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.go{background:var(--btn);color:var(--btntxt);font-size:1.5rem;font-weight:700;border-radius:999px;padding:14px 30px;box-shadow:0 5px 0 rgba(0,0,0,.22);align-self:center}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.bar{display:flex;align-items:center;gap:10px;font-weight:700}
.track{flex:1;height:16px;border-radius:99px;background:var(--opt);overflow:hidden}
.fill{height:100%;background:var(--good);border-radius:99px;transition:width .4s}
svg.shape{width:min(52vw,210px);height:min(52vw,210px)}
.opts{display:grid;gap:12px}
.opts.row{grid-template-columns:1fr 1fr}
.opt{background:var(--opt);border:4px solid var(--optb);border-radius:22px;padding:14px;font-size:1.25rem;font-weight:600;min-height:64px;text-align:center}
.opt:focus-visible,.go:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.opt.good{background:var(--goodbg);border-color:var(--good)}
.opt.bad{background:var(--oopsbg);border-color:var(--oops);animation:sh .35s}
.opt[disabled]{opacity:.9;cursor:default}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:3.6em;font-weight:600;font-size:1.15rem}
.fb.good{color:var(--good)}.fb.bad{color:var(--oops)}
.stars{font-size:2.4rem;letter-spacing:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hide{display:none}
.pop{animation:pp .5s}@keyframes pp{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
</style>
</head>
<body>
<main id="app"></main>
<script>
function reg(n){var a=[];for(var i=0;i<n;i++){var t=-Math.PI/2+i*2*Math.PI/n;a.push((50+44*Math.cos(t)).toFixed(1)+","+(50+44*Math.sin(t)).toFixed(1))}return a.join(" ")}
var S={
square:["22,22 78,22 78,78 22,78","#f2456d"],
rect:["10,28 90,28 90,72 10,72","#3b82f6"],
pent:[reg(5),"#12b886"],
boom:["45,10 92,48 76,90 52,58 8,72","#2f9ee8"],
hex:[reg(6),"#8fc93a"],
longhex:["4,50 28,22 72,22 96,50 72,78 28,78","#ff9f43"],
oct:[reg(8),"#ffd43b"],
arrow:["50,8 92,46 64,46 64,92 50,76 36,92 36,46 8,46","#3a4fb0"],
A:["10,20 55,10 60,45 92,55 85,92 10,90","#f06a7a"],
F:["14,26 90,8 84,86 38,90 22,62","#9b5de5"]
};
function svg(k){var s=S[k];return '<svg class="shape pop" viewBox="0 0 100 100" role="img" aria-label="a shape"><polygon points="'+s[0]+'" fill="'+s[1]+'" stroke="rgba(0,0,0,.35)" stroke-width="2" stroke-linejoin="round"/></svg>'}
var R1=[
["square",1,"A square has 4 equal sides and 4 equal angles."],
["rect",0,"A rectangle has equal angles, but its sides are not all the same length."],
["pent",1,"All 5 sides and all 5 angles match."],
["boom",0,"The sides and angles are all different sizes."],
["hex",1,"All 6 sides and all 6 angles match."],
["longhex",0,"It has 6 sides, but they are not all the same length."],
["oct",1,"All 8 sides and all 8 angles match."],
["arrow",0,"It has 8 sides, but they are not all equal."]
];
var R2=[
["A","an irregular hexagon","it has 6 sides and angles but they are not equal"],
["oct","a regular octagon","it has 8 equal sides and 8 equal angles"],
["hex","a regular hexagon","it has 6 equal sides and 6 equal angles"],
["arrow","an irregular octagon","it has 8 sides and angles but they are not equal"],
["pent","a regular pentagon","it has 5 equal sides and 5 equal angles"],
["F","an irregular pentagon","it has 5 sides and angles but they are not equal"]
];
var letters={A:"A",oct:"B",hex:"C",arrow:"D",pent:"E",F:"F"};
var app=document.getElementById("app");
var stars=0,qs=[],qi=0,round=1,first=true,audio;
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function beep(f,d){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();var o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function start(){
app.innerHTML='<h1>🔍 Shape Detectives</h1>'+
'<div class="card"><div class="big">🕵️</div><h2>Can you spot the shapes?</h2></div>'+
'<div class="two"><div class="mini"><b>⭐ Regular</b>All sides are the same.<br>All angles are the same.</div><div class="mini"><b>⚡ Irregular</b>The sides or angles are not all the same.</div></div>'+
'<button class="go" id="s1">Let’s play!</button>';
document.getElementById("s1").onclick=function(){stars=0;round=1;qs=shuf(R1);qi=0;show()};
}
function head(){var t=round==1?qs.length:qs.length;return '<div class="bar"><span>Round '+round+'</span><div class="track"><div class="fill" style="width:'+(qi/t*100)+'%"></div></div><span>⭐ '+stars+'</span></div>'}
function show(){
first=true;var q=qs[qi],h=head();
if(round==1){
app.innerHTML=h+'<div class="card"><h2>Is this shape regular or irregular?</h2>'+svg(q[0])+'</div><div class="opts row"><button class="opt" data-v="1">⭐ Regular</button><button class="opt" data-v="0">⚡ Irregular</button></div><p class="fb" id="fb" aria-live="polite"></p>';
[].forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){ans(b,+b.dataset.v==q[1],q[2])}});
}else{
var wrong=shuf(R2.filter(function(r){return r!==q})).slice(0,2),all=shuf([q].concat(wrong));
app.innerHTML=h+'<div class="card"><h2>Shape '+letters[q[0]]+' is…</h2>'+svg(q[0])+'</div><div class="opts" id="o"></div><p class="fb" id="fb" aria-live="polite"></p>';
var o=document.getElementById("o");
all.forEach(function(r){var b=document.createElement("button");b.className="opt";b.textContent=cap(r[1])+" because "+r[2]+".";b.onclick=function(){ans(b,r===q,"Look at the sides and angles. "+cap(q[1])+" because "+q[2]+".")};o.appendChild(b)});
}}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function ans(b,ok,why){
var fb=document.getElementById("fb");
if(ok){
if(first)stars++;beep(660,.15);setTimeout(function(){beep(880,.2)},150);
b.classList.add("good");[].forEach.call(app.querySelectorAll(".opt"),function(x){x.disabled=true});
fb.className="fb good";fb.textContent="🎉 Yes! "+why;
var n=document.createElement("button");n.className="go";n.textContent=qi+1<qs.length?"Next ➜":(round==1?"Round 2 ➜":"All done! 🏆");
n.onclick=function(){qi++;if(qi<qs.length)show();else if(round==1){round=2;qs=shuf(R2);qi=0;show()}else end()};
app.appendChild(n);n.focus();
}else{first=false;beep(260,.25);b.classList.add("bad");b.disabled=true;fb.className="fb bad";fb.textContent="Oops! Not quite. Have another go! 💪"}
}
function end(){
var tot=R1.length+R2.length,pct=stars/tot,msg=pct>.8?"Super Shape Detective!":pct>.5?"Great detective work!":"Good try! Play again to get more stars!";
app.innerHTML='<h1>🏆 Well done!</h1><div class="card pop"><div class="big">🕵️‍♀️</div><h2>'+msg+'</h2><p class="stars">'+"⭐".repeat(Math.max(1,Math.round(pct*5)))+'</p><p>You got '+stars+' out of '+tot+' on the first try.</p></div><button class="go" id="again">Play again 🔁</button>';
document.getElementById("again").onclick=start;
}
start();
</script>
</body>
</html>
